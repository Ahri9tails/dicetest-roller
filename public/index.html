<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link href="css/room.css" rel="stylesheet">
	<script src="js/room.js" defer></script>
</head>
<body>
	<div class="center-div">
		<div class=" form-container">
			<form class= "grid-col-2 online-form" action="./diceroller.html">
				<div class="room-input-container">
					<label class="room-label" for="room">Room Code</label>
					<p id="room-instructions">join or create a room with a room code</p>
					<input class="room-input" type="text" id="room" name="room-code" required minlength="4">
				</div>
				<div class="online-button-container">
					<button class="online-button" type="submit">ONLINE</button>
				</div>
				<a class="offline-button-container" href="diceroller.html">
					<button type="button" class="offline-button">OFFLINE</button>
				</a>
			</form>

		</div>
	</div>
</body>
</html>
